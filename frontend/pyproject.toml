[project]
name = "urlshortener-web"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "starlette>=0.46",
    "jinja2>=3.1,<4",
    "uvicorn>=0.32,<1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
urlshortener_web = [
    "templates/*.html",
    "static/*.css",
    "static/*.js",
    "static/assets/*.webp",
    "static/fonts/*.woff2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
